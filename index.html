<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>SynagogueScreen</title>
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!--
      Deploy updates are detected via Firestore /version/current (see
      src/hooks/useVersionReload.js) — the kiosk reloads itself when the
      deployed version is newer than the build-time __APP_VERSION__.
      The old service-worker poller (sw.js) never worked behind
      CloudFront's stale-edge responses and was removed.
    -->
    <script>
      // Unregister any service worker left from the previous update
      // mechanism, so it stops controlling the page and its cached
      // responses can't shadow fresh deploys.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        }).catch(() => {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
