name: Deploy to S3 + CloudFront

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # workflow_run fires on BOTH success and failure of the Tests workflow —
    # deploy only when it concluded successfully (or on manual dispatch).
    # A red suite must never reach the live kiosk.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # workflow_run must check out the commit Tests actually validated —
          # the default (default-branch HEAD) could be a newer, untested push.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump package.json version
        id: bump
        run: |
          # Next patch from the latest semver tag (ignores non-semver tags
          # like the temporary screen-upload release tag).
          latest=$(git tag --list --sort=-creatordate 'v[0-9]*.[0-9]*.[0-9]*' | head -n1)
          [[ -n "$latest" ]] || latest="v0.0.0"
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            next="0.0.1"
          fi
          echo "Latest tag: $latest → next: $next"
          npm version "$next" --no-git-tag-version --allow-same-version
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          # 1. Everything except index.html + screen images: 1h cache
          #    (asset filenames are content-hashed → safe to cache)
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude "screen/*" \
            --exclude "index.html" \
            --cache-control "max-age=3600,public"
          # 2. index.html: no-cache — it references the hashed bundle names,
          #    so a stale edge copy delays every deploy by up to 1h.
          aws s3 cp dist/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Publish version to Firestore
        # The kiosk's update mechanism (src/hooks/useVersionReload.js):
        # clients watch /version/current and reload when it is newer than
        # the build-time __APP_VERSION__ — this is how they pick up the
        # deploy that just landed in S3/CloudFront. Written AFTER the
        # invalidation so a reload can't fetch the previous bundle.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DEPLOY_SA_KEY }}
        run: |
          node scripts/publish-version.mjs "${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v${{ steps.bump.outputs.version }}"
          echo "Releasing $v"
          gh release create "$v" \
            --title "$v" \
            --generate-notes \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}"

      # NOTE: the version bump is NOT committed back to master — the branch
      # is PR-only (protected). It doesn't need to be: this workflow rewrites
      # package.json from the tag-derived value on every deploy, the release
      # tag is the version source of truth, and the build bakes the same
      # value into the bundle and Firestore.