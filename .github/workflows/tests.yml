name: Tests

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Tests (Vitest)
        run: npm test

      - name: Lint
        run: npm run lint